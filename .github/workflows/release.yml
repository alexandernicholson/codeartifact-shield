name: Release

# Builds the sdist + wheel for a tag, generates GitHub build-provenance
# attestations for both, and uploads them to the tag's GitHub release
# (creating a bare release if one doesn't exist yet).
#
# Verify an asset against the attestation with:
#   gh attestation verify codeartifact_shield-<version>-py3-none-any.whl \
#     --repo <owner>/codeartifact-shield

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build, attest, and upload assets for"
        required: true

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build==1.3.0
      - run: python -m build
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*
      - name: Upload assets to the tag's release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --verify-tag --notes ""
          gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
